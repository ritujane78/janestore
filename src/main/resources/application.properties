spring.application.name=janestore
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
logging.level.root=${LOGGING_LEVEL:ERROR}
logging.file.name=${LOGGING_FILE_NAME:C:\\Users\\rituj\\Documents\\Coding\\fullstack-react-springboot\\logs\\janestore.log}
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:janestore}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.jpa.show-sql=${JPA_SHOW_URL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

management.endpoint.health.show-details=always
management.endpoints.web.base-path=/janestore/actuator
management.endpoints.web.exposure.include=*

management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Janestore is a simple e-commerce application built with Spring Boot.
info.app.version=1.0.0
info.app.email=ritujane78@gmail.com

spring.security.user.name=ritu
spring.security.user.password=janestore
